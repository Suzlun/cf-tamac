schema: new-feature

context: |
  Repository: cf-tamac
  Tech stack: TypeScript, React, Cloudflare Workers, Hono, Drizzle ORM
  Testing: Vitest (unit/integration), Playwright (e2e)

  Change completion boundary:
  - A Change is complete when the requested feature is fully implemented and merge-ready with repository-scoped code, configuration, generated artifacts, documentation, review, and reproducible local or CI verification.
  - Do not include release execution, deployment, environment provisioning, credential access or probes, external approval, staging or production validation, operational rehearsal, or production observation in OpenSpec artifacts, tasks, acceptance criteria, or completion conditions.
  - Record release impact in the pull request template only. It never blocks Change completion.

  UI artifact order:
  - When a Change needs a user-visible UI, create the artifacts in this order: proposal, wireframe JSON, spec, then design.
  - `openspec/designer` owns the minimum visible surface in `.wireframe.json`. A matching `.wireframe.html` is generated preview output and is never hand-edited or used as a design source.
  - Specs define user-observable behavior without adding visible controls, settings, screens, labels, versions, model names, or internal state absent from the wireframe.
  - During apply, resolve only self-evident implementation details that preserve the visible surface. Escalate contradictions or non-self-evident visible changes.

  Spec -> Test contract:
  - Specs live at openspec/specs/**/spec.md (source of truth)
  - Every Scenario heading MUST end with a stable Scenario ID in parentheses:
    - Example: #### Scenario: Create a user (USER-MGMT-S001)
  - Scenario ID format: ^[A-Z0-9]+(?:-[A-Z0-9]+)*-S\d{3,}$
  - Automated tests MUST reference Scenario IDs in test titles using brackets:
    - Example: it('[USER-MGMT-S001] ...', ...)
  - If a scenario cannot be automated, mark it explicitly with: Tags: manual

  Note on Spec Units:
  - Some schemas in this repo (e.g., new-feature, and future fix-feature/change-feature) use Spec Units:
    - Spec Unit = <capability>
    - <capability>: kebab-case enduring responsibility name (e.g., agent-lifecycle, client-management)
    - Main spec path: openspec/specs/<capability>/spec.md

rules:
  specs:
    - Every Scenario heading MUST include a Scenario ID suffix in parentheses.
    - Prefer Scenario IDs derived directly from the Spec Unit name (e.g., AGENT-LIFECYCLE-S001).
    - Prefer Given/When/Then bullets. Keep scenarios testable and observable.
    - 'If a scenario cannot be automated, include `Tags: manual` and explain why in the change proposal/PR.'
  tasks:
    - For each ADDED/MODIFIED Scenario ID, include a task to add/update automated tests that reference the Scenario ID.
    - Every task MUST be repository-scoped, merge-verifiable, and finish with objective local or CI evidence.
    - Tasks MUST NOT require release execution, deployment, environment provisioning, credential access or probes, external approval, staging or production validation, operational rehearsal, or production observation.
    - UI implementation tasks MUST reference the approved `.wireframe.json` source when a wireframe exists. They MUST NOT task direct edits to generated `.wireframe.html` files.

