schema: behavior-change

context: |
  Repository: cf-tamac
  Tech stack: TypeScript, React, Next.js, Cloudflare Workers, Durable Objects, Drizzle ORM, TypeSpec, Protobuf, Connect RPC
  Product boundaries: Agent Worker, server-side SDK, Management Client
  Testing: Vitest (pure unit), Playwright (E2E)

  Request authority boundary:
  - The primary agent that receives the owner's instruction reconstructs a Request candidate in conversation and creates `request.md` only after explicit owner confirmation.
  - An unconfirmed Request candidate, inference, assumption, candidate means, non-goal, or rejected interpretation never becomes a repository artifact.
  - `request.md` contains only the owner-confirmed Request, explicitly stated outcome constraints, explicitly required means, and confirmation evidence.
  - `openspec/proposer` rejects a Change without `Request-Status: CONFIRMED` and never creates, edits, or supplements `request.md`.
  - Repository evidence, common practice, security recommendations, implementation necessity, downstream artifacts, and tests cannot create product outcomes or Requirements.
  - Required Means constrain architecture and tasks. Candidate Means remain design options. Neither becomes a product Requirement or Scenario.

  UI / UX boundary:
  - `UX-Mode: NONE` means no user-visible surface changes.
  - `UX-Mode: CONTINUITY` preserves an identified existing experience and records its continuity source.
  - `UX-Mode: SHAPE` defines the primary user task and the intended experience direction before specifications are written.
  - A visible UI composition or placement may be an Outcome Constraint when it directly expresses the experience the customer wants. Internal component structure remains a means.

  YAGNI and reuse boundary:
  - Keep only Requirements and Scenarios directly entailed by the owner-confirmed `request.md`.
  - Standards, RFC compliance, packages, and implementation techniques remain means unless the customer explicitly requires their externally observable effect.
  - Before creating an `architecture-change`, investigate existing repository assets, installed packages, and established external packages.
  - Independent implementation is allowed only when none of the reusable candidates can satisfy the confirmed outcome within security, supply-chain, and architecture rules.
  - Every architecture-change delta Spec Unit has at least one Reuse Assessment decision. Split each Spec Unit into package-replaceable generic capabilities before deciding reuse.
  - Reuse evidence is valid only when the cited research report explicitly includes the generic capability in its investigation scope. Requirement traceability is not package-candidate coverage.
  - Distinguish repository code, workspace packages, direct dependencies, repository-adopted dependencies, transitive-only dependencies, new external packages, and dependency updates.

  Change completion boundary:
  - A Change is complete when its Work Packages are implemented and merge-ready with reproducible repository-local or CI evidence.
  - Do not include release execution, deployment, environment provisioning, credential access, external approval, staging or production validation, rehearsal, or production observation.

  Test -> Spec contract:
  - Main specs live at `openspec/specs/**/spec.md`.
  - Active delta specs participate in structural, duplicate-ID, and conflict validation before archive or sync.
  - Every Scenario heading ends with a stable ID such as `(AGENT-LIFECYCLE-S001)`.
  - Playwright E2E test titles may reference existing Scenario IDs such as `[AGENT-LIFECYCLE-S001]`.
  - Scenario definitions do not require automated test references, and pure unit tests never reference Scenario IDs.
  - Only Playwright E2E tests and pure unit tests are allowed. Do not add integration, connection, contract, real-database, Workerd-specific, or runtime-specific test suites.
  - Never change production APIs, exports, factories, branches, bindings, or configuration solely to support tests.

  Spec Units:
  - A Spec Unit is a kebab-case enduring product capability or externally owned contract area.
  - Main specs live at `openspec/specs/<capability>/spec.md`.

rules:
  proposal:
    - Derive the proposal only from `Request-Status: CONFIRMED` in `request.md`.
    - Keep outcomes separate from required and candidate means.
    - Cite repository evidence and record the positive Change boundary and observable success without adding outcomes.
    - Do not record non-goals, rejected interpretations, unused technologies, or the absence of old implementation in the proposal.
    - Return to the primary agent when the Request is missing, unclear, or must change.
  specs:
    - Begin every delta spec with `## Purpose`.
    - Requirements and Scenarios contain only positive observable behavior or externally owned constraints directly entailed by the owner-confirmed Request.
    - Do not make non-goals, rejected alternatives, absent legacy behavior, absent implementation, or technologies and features that will not be added into Requirements or Scenarios.
    - Remove an obsolete Requirement through `REMOVED Requirements`; do not replace it with an inverse Requirement.
    - Express confirmed authorization and confidentiality outcomes as positive guarantees; rejection Scenarios may demonstrate those guarantees.
    - Do not specify standards, RFC compliance, packages, or implementation techniques unless their externally observable effect is itself a confirmed outcome constraint.
    - Every Scenario heading includes a stable Scenario ID suffix in parentheses.
  design:
    - Keep only material decisions, reuse assessment, boundaries, data, security, migration, rollback, failure modes, risks, verification, and revisit triggers.
    - Record one or more Reuse Assessment rows for every delta Spec Unit, split by package-replaceable generic capability.
    - Record the reuse source classification, adoption decision, selected target and version, and a current research report whose investigation scope explicitly covers that capability.
    - Treat transitive-only dependencies as unadopted until the consuming package declares and reviews a direct dependency.
    - Permit LIMITED_COMPLEMENT only with evidence that repository assets and established external packages cannot satisfy the confirmed outcome.
  tasks:
    - Keep `tasks.md` as a coarse Work Package ledger with objective completion evidence.
    - Do not create file-by-file, helper-by-helper, or test-layer-by-test-layer plans.
    - Do not require release execution, deployment, external environment operations, credentials, or external approval.
