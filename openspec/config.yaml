schema: behavior-change

context: |
  Repository: cf-tamac
  Tech stack: TypeScript, React, Next.js, Cloudflare Workers, Durable Objects, Drizzle ORM, TypeSpec, Protobuf, Connect RPC
  Product boundaries: Agent Worker, server-side SDK, Management Client
  Testing: Vitest (pure unit), Playwright (E2E)

  Intent resolution boundary:
  - `proposal.md` is the authoritative interpretation of the request.
  - Use `Intent-Resolution: REQUEST_SUFFICIENT` only when the request itself resolves every material ambiguity.
  - Use `Intent-Resolution: OWNER_CONFIRMED` only when the owner explicitly confirms the reconstructed intent.
  - Keep `Intent-Resolution: DRAFT` while an ambiguity could materially change behavior, contracts, architecture, security, data, dependencies, or scope.
  - Classify solution-shaped wording as Desired Outcome, Outcome Constraint, Required Means, or Candidate Means.
  - Required Means constrain architecture and tasks. Candidate Means remain options. Neither becomes a product Requirement or Scenario.

  UI / UX boundary:
  - `UX-Mode: NONE` means no user-visible surface changes.
  - `UX-Mode: CONTINUITY` preserves an identified existing experience and records its continuity source.
  - `UX-Mode: SHAPE` defines the primary user task and the intended experience direction before specifications are written.
  - A visible UI composition or placement may be an Outcome Constraint when it directly expresses the experience the customer wants. Internal component structure remains a means.

  YAGNI and reuse boundary:
  - Keep only Requirements and Scenarios whose customer value is evident from the request or confirmed interpretation.
  - Standards, RFC compliance, packages, and implementation techniques remain means unless the customer explicitly requires their externally observable effect.
  - Before creating an `architecture-change`, investigate existing repository assets, installed packages, and established external packages.
  - Independent implementation is allowed only when none of the reusable candidates can satisfy the confirmed outcome within security, supply-chain, and architecture rules.

  Change completion boundary:
  - A Change is complete when its Work Packages are implemented and merge-ready with reproducible repository-local or CI evidence.
  - Do not include release execution, deployment, environment provisioning, credential access, external approval, staging or production validation, rehearsal, or production observation.

  Test -> Spec contract:
  - Main specs live at `openspec/specs/**/spec.md`.
  - Active delta specs participate in structural, duplicate-ID, and conflict validation before archive or sync.
  - Every Scenario heading ends with a stable ID such as `(AGENT-LIFECYCLE-S001)`.
  - Playwright E2E test titles may reference existing Scenario IDs such as `[AGENT-LIFECYCLE-S001]`.
  - Scenario definitions do not require automated test references, and pure unit tests never reference Scenario IDs.
  - Only Playwright E2E tests and pure unit tests are allowed. Do not add integration, connection, contract, real-database, Workerd-specific, or runtime-specific test suites.
  - Never change production APIs, exports, factories, branches, bindings, or configuration solely to support tests.

  Spec Units:
  - A Spec Unit is a kebab-case enduring product capability or externally owned contract area.
  - Main specs live at `openspec/specs/<capability>/spec.md`.

rules:
  proposal:
    - Keep outcomes separate from required and candidate means.
    - Cite repository evidence and record assumptions, decisions, observable success, and confirmation evidence.
    - Do not resolve a proposal while a material decision remains open.
  specs:
    - Begin every delta spec with `## Purpose`.
    - Requirements and Scenarios contain only observable behavior or externally owned constraints with evident customer value.
    - Do not specify standards, RFC compliance, packages, or implementation techniques unless their externally observable effect is itself a confirmed outcome constraint.
    - Every Scenario heading includes a stable Scenario ID suffix in parentheses.
  design:
    - Keep only material decisions, reuse assessment, boundaries, data, security, migration, rollback, failure modes, risks, verification, and revisit triggers.
    - Record relevant repository assets, installed packages, established external packages, selected reuse, and evidence required for any independent implementation.
  tasks:
    - Keep `tasks.md` as a coarse Work Package ledger with objective completion evidence.
    - Do not create file-by-file, helper-by-helper, or test-layer-by-test-layer plans.
    - Do not require release execution, deployment, external environment operations, credentials, or external approval.
