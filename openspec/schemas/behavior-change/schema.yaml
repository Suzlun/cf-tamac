name: behavior-change
version: 2
description: 所有者確認済みの要求から、観測可能な振る舞いの変更を提案、仕様、作業パッケージの順で管理する

artifacts:
  - id: request
    generates: request.md
    description: プライマリエージェントが所有者確認後に保存する要求
    template: request.md
    instruction: |
      この成果物は、指示を受けたプライマリエージェントだけが所有者の明示確認後に作成する。
      Request候補、推論、仮定、候補手段、非目標、却下した解釈をファイルへ保存しない。
      所有者が確認した要求、明示した成果制約、明示的に必須とした手段だけを記載する。
      成果制約または必須手段がない場合は、対応する任意の節を作成しない。
      `Request-Status`は`CONFIRMED`だけを使用し、確認前のファイルを作成しない。
      `Owner Confirmation`には、確認済みRequestの要約と現在の会話における所有者の明示回答を記録する。
      proposerはこの成果物を作成、変更、補完してはならない。
    requires: []

  - id: proposal
    generates: proposal.md
    description: 所有者確認済みRequestを実現する変更提案
    template: proposal.md
    instruction: |
      `Request-Status: CONFIRMED`のrequest.mdを読み、記載された要求の範囲だけを提案する。
      request.mdが存在しない、確認済みでない、または意味が不明な場合は成果物を作成せずプライマリエージェントへ返す。
      関連するリポジトリの事実を確認する。未確認の仮定でRequestを補わず、Requestの変更が必要な場合はプライマリエージェントへ返す。
      リポジトリの事実、一般的な慣行、セキュリティ上の推奨、実装上の必要性から新しい成果または成果制約を追加しない。
      所有者が明示した必須手段は設計または作業の制約とし、製品Requirementへ変換しない。
      `UX-Mode` は `NONE`、`CONTINUITY`、`SHAPE` のいずれかとする。
      `CONTINUITY` では既存体験の根拠を Continuity Source に記録する。
      `SHAPE` では利用者が完了したい中心作業を Primary User Task、体験の方向性を UX Direction に記録する。
      Thesaurus は業務用語の統一が必要な場合だけ追加する。
      Change Boundaryは実現する肯定的な成果だけを記載し、非目標、対象外、却下案、使用しない技術、旧実装の不在を記載しない。
      実装手順、ファイル一覧、試験階層別計画は記載しない。
    requires:
      - request

  - id: specs
    generates: 'specs/*/spec.md'
    description: Spec Unit ごとの観測可能な差分仕様
    template: spec.md
    instruction: |
      request.mdとproposal.mdを読み、所有者確認済みRequestから直接導ける各 Spec Unit に `specs/<capability>/spec.md` を作成する。
      冒頭の `## Purpose` に、所有者確認済みRequestが求める永続的仕様領域の目的を肯定形で記載する。
      差分見出しは `## ADDED Requirements`、`## MODIFIED Requirements`、`## REMOVED Requirements`、`## RENAMED Requirements` だけを使用する。
      Requirement と Scenario には、所有者が確認した利用者または外部契約から観測できる肯定的な終端状態だけを記載する。
      規格準拠、RFC準拠、実装方式、ファイル、パッケージ、補助処理、移行作業、試験計画を Requirement または Scenario にしない。ただし、顧客が求める体験そのものを表す可視のUI構成または配置は Outcome Constraint として記載できる。
      非目標、対象外、却下案、旧実装や旧経路が存在しないこと、特定の技術や機能を追加しないことをRequirementまたはScenarioにしない。
      削除する既存Requirementは`REMOVED Requirements`で除去し、反対向きのRequirementへ置き換えない。
      認可や秘密非開示など拒否自体が確認済み成果に含まれる場合も、認可された主体や公開可能な情報を表す肯定的な保証として定義し、その保証を観測する拒否Scenarioを記載できる。
      Scenario 見出しは `#### Scenario: <名称> (<CAPABILITY>-S###)` とし、安定した識別子を付ける。
      自動化できない Scenario は見出しの近くに `Tags: manual` を記載する。
    requires:
      - request
      - proposal

  - id: tasks
    generates: tasks.md
    description: 実装成果をまとめた粗い作業パッケージ台帳
    template: tasks.md
    instruction: |
      tasks.md は `- [ ] WP<number>: <成果>` 形式の作業パッケージ台帳とする。
      各作業パッケージに対象の Requirement または Scenario と、客観的な Completion Evidence を記載する。
      ファイル単位、補助処理単位、試験階層単位へ分解しない。
      リリース、デプロイ、外部環境操作、認証情報、外部承認を完了条件に含めない。
    requires:
      - request
      - proposal
      - specs

apply:
  requires:
    - request
    - tasks
  tracks: tasks.md
  instruction: |
    所有者確認済みRequest、提案、差分仕様を読み、Requestが求める成果へ因果的につながる作業パッケージだけを実装、検証する。
    全作業パッケージ完了時は `node scripts/openspec/verify-scenario-coverage.mjs --change <change-id> --require-test-references` を実行し、選択 Change の実効仕様と試験参照を一致させる。
    成果物がRequestを拡張、反転、または誤解している場合、重要な矛盾または未解決判断を発見した場合は作業を止め、プライマリエージェントへ返す。
