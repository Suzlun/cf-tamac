name: architecture-change
version: 4
description: 所有者確認済みの要求から、物質的な構造変更を提案、必要な仕様、設計、作業パッケージの順で管理する

artifacts:
  - id: request
    generates: request.md
    description: プライマリエージェントが所有者確認後に保存する要求
    template: request.md
    instruction: |
      この成果物は、指示を受けたプライマリエージェントだけが所有者の明示確認後に作成する。
      Request候補、推論、仮定、候補手段、非目標、却下した解釈をファイルへ保存しない。
      所有者が確認した要求、明示した成果制約、明示的に必須とした手段だけを記載する。
      成果制約または必須手段がない場合は、対応する任意の節を作成しない。
      `Request-Status`は`CONFIRMED`だけを使用し、確認前のファイルを作成しない。
      `Owner Confirmation`には、確認済みRequestの要約と現在の会話における所有者の明示回答を記録する。
      proposerはこの成果物を作成、変更、補完してはならない。
    requires: []

  - id: proposal
    generates: proposal.md
    description: 所有者確認済みRequestを実現する変更提案
    template: proposal.md
    instruction: |
      `Request-Status: CONFIRMED`のrequest.mdを読み、behavior-changeと同じ提案契約で記載された要求の範囲だけを提案する。
      request.mdが存在しない、確認済みでない、または意味が不明な場合は成果物を作成せずプライマリエージェントへ返す。
      構造変更という手段を顧客成果へ置き換えず、Required Means または Candidate Means として分類する。
      Requestが観測可能な振る舞いを変更しない場合は`.openspec.yaml`へ`skip_specs: true`を設定し、Spec Unitsへ理由付きの「なし」を記載して差分仕様を作成しない。
      Requestが観測可能な振る舞いも変更する場合は`skip_specs`を設定せず、確認済みRequestから直接導けるdelta Spec Unitだけを記載する。
      proposal.mdとdesign.mdを確定する前に、存在する各delta Spec Unitをパッケージで代替可能な汎用能力へ分解し、利用できる既存コード、workspace package、対象packageの直接依存、他packageで採用済みの依存、推移依存、新規外部候補、更新候補を調査する。
      再利用判断に使う調査報告は、対象の汎用能力を`調査範囲`へ明記した現在の一次資料付き報告に限る。Requirement対応表または別能力の候補調査を、外部候補調査の証拠へ流用しない。
      リポジトリの事実、一般的な慣行、セキュリティ上の推奨、実装上の必要性から新しい成果または成果制約を追加しない。
      `UX-Mode` は `NONE`、`CONTINUITY`、`SHAPE` のいずれかとし、条件に応じた UI / UX Impact を記載する。
      Change Boundaryは実現する肯定的な成果だけを記載し、非目標、対象外、却下案、使用しない技術、旧実装の不在を記載しない。
      実装手順、ファイル一覧、試験階層別計画は記載しない。
    requires:
      - request

  - id: specs
    generates: 'specs/*/spec.md'
    description: 観測可能な振る舞いも変える場合に、構造変更後の結果を定める差分仕様
    template: spec.md
    instruction: |
      `.openspec.yaml`に`skip_specs: true`がある場合は成果物を作成しない。
      それ以外の場合はrequest.mdとproposal.mdを読み、所有者確認済みRequestから直接導ける各 Spec Unit に `specs/<capability>/spec.md` を作成する。
      冒頭の `## Purpose` に、所有者確認済みRequestが求める永続的仕様領域の目的を肯定形で記載する。
      Requirement と Scenario には所有者が確認した利用者または外部契約から観測できる肯定的な終端状態だけを記載し、内部構造を仕様化しない。
      規格準拠、RFC準拠、パッケージ、実装方式を Requirement または Scenario にしない。ただし、顧客が求める体験そのものを表す可視のUI構成または配置は Outcome Constraint として記載できる。
      非目標、対象外、却下案、旧実装や旧経路が存在しないこと、特定の技術や機能を追加しないことをRequirementまたはScenarioにしない。
      削除する既存Requirementは`REMOVED Requirements`で除去し、反対向きのRequirementへ置き換えない。
      認可や秘密非開示など拒否自体が確認済み成果に含まれる場合も、認可された主体や公開可能な情報を表す肯定的な保証として定義し、その保証を観測する拒否Scenarioを記載できる。
      Scenario 見出しは `#### Scenario: <名称> (<CAPABILITY>-S###)` とする。
    requires:
      - request
      - proposal

  - id: design
    generates: design.md
    description: 確認済みRequestと存在する差分仕様を満たすために必要な物質的な設計判断
    template: design.md
    instruction: |
      確認済みRequest、proposal.md、存在する差分仕様を実現するために必要な物質的判断だけを記載する。
      Material Decisions、Reuse Assessment、Boundaries、Data、Security、Migration、Rollback、Failure Modes、Risks、Verification、Revisit Triggers 以外の節を追加しない。
      Reuse Assessmentには存在する全delta Spec Unitを少なくとも一行ずつ記載し、各Spec Unitをパッケージで代替可能な汎用能力へ分解する。同じSpec Unitに複数能力がある場合は行を分ける。`skip_specs: true`の場合はSpec Unitや調査行を作らず、該当しない理由を記載する。
      各行はSpec Unit、Reusable Capability、Source Classification、Decision、Selected Reuse / Version、Research Evidence、Limited Complement Justificationを持つ。
      Source Classificationは`REPOSITORY_CODE`、`WORKSPACE_PACKAGE`、`DIRECT_DEPENDENCY`、`REPOSITORY_DEPENDENCY`、`TRANSITIVE_ONLY`、`NEW_EXTERNAL`、`EXISTING_UPDATE`、`NO_REUSABLE_CANDIDATE`のいずれかとする。
      Decisionは`REUSE`、`ADOPT`、`UPDATE`、`REPLACE`、`LIMITED_COMPLEMENT`のいずれかとする。推移依存は直接採用済みと扱わず、利用するpackageが正規の直接依存として宣言する判断を記載する。
      Research Evidenceには対象能力を明示的な調査範囲に含む`docs/report/research/**`の報告を記載する。同じ報告を複数行から参照できる。
      `LIMITED_COMPLEMENT`は、既存資産、導入済み依存、実績ある外部候補のいずれでも確認済み成果を満たせない証拠がある場合だけ使用し、その限定補完根拠を記載する。
      ファイル一覧、ディレクトリ構成、補助処理一覧、詳細な実装手順、試験階層別計画を記載しない。
      該当しない節は削除せず、理由付きで「なし」と記載する。
      移行と切り戻しはリポジトリで実施・検証できる境界に限定し、外部環境操作を完了条件にしない。
    requires:
      - request
      - proposal
      - specs

  - id: tasks
    generates: tasks.md
    description: 実装成果をまとめた粗い作業パッケージ台帳
    template: tasks.md
    instruction: |
      tasks.md は `- [ ] WP<number>: <成果>` 形式の作業パッケージ台帳とする。
      各作業パッケージに対象の設計判断または存在するScenarioと、客観的な Completion Evidence を記載する。
      ファイル単位、補助処理単位、試験階層単位へ分解しない。
      リリース、デプロイ、外部環境操作、認証情報、外部承認を完了条件に含めない。
    requires:
      - request
      - proposal
      - specs
      - design

apply:
  requires:
    - request
    - tasks
  tracks: tasks.md
  instruction: |
    所有者確認済みRequest、提案、存在する差分仕様、設計判断を読み、Requestが求める成果へ因果的につながる作業パッケージだけを実装、検証する。
    全作業パッケージ完了時は `node scripts/openspec/verify-scenario-coverage.mjs --change <change-id> --require-test-references` を実行し、選択 Change の実効仕様と試験参照を一致させる。
    成果物がRequestを拡張、反転、または誤解している場合、重要な矛盾または未解決判断を発見した場合は作業を止め、プライマリエージェントへ返す。
