version: v2
modules:
  # Stage 1-8 Agent TypeSpec emits cftamac.agent.v1 proto here.
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # TypeSpec protobuf emitter writes cftamac/agent/v1.proto for package cftamac.agent.v1.
    - PACKAGE_DIRECTORY_MATCH
    # Foundation already exposed CheckHealth/PublishIntegrationEvent names; keep field/service stability.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  # Field removal policy: reserve old numbers/names before deleting in TypeSpec/proto.
  use:
    - FILE
