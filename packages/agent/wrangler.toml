name = "cf-tamac-agent"
main = "src/index.ts"
compatibility_date = "2026-06-20"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "AI_AGENT"
class_name = "AIAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AIAgent"]

[[r2_buckets]]
binding = "AGENT_BLOBS"
bucket_name = "cf-tamac-agent-blobs"

[vars]
AGENT_RPC_AUDIENCE = "cf-tamac-agent"

# Required secrets are provisioned with `wrangler secret put` and never committed.
# - AGENT_CLIENT_JWT_PUBLIC_KEYS
# - AGENT_EXTENSION_SIGNATURE_KEYS
# - AGENT_MODEL_PROVIDER_SECRET_REFS
