name = "cf-tamac-agent"
main = "src/index.ts"
compatibility_date = "2026-06-20"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "AI_AGENT"
class_name = "AIAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AIAgent"]

[[r2_buckets]]
binding = "AGENT_BLOBS"
bucket_name = "cf-tamac-agent-blobs"

[[ratelimits]]
# production ingress の bucket は staging および他の Worker binding から完全に分離します。
name = "PROVIDER_INGRESS_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 100
period = 60

[ai]
binding = "AI"

[vars]
# Deploy Button users keep this audience aligned with `AGENT_CONTROL_PLANE_TRUST.audiences`.
AGENT_RPC_AUDIENCE = "cf-tamac-agent"

# Required secrets are provisioned with `wrangler secret put` and never committed.
# `AGENT_CONTROL_PLANE_TRUST` is public-key-only JSON; it must never contain an Ed25519 private `d` value.
# - AGENT_AUDIT_HASH_PEPPER
# - AGENT_CONTROL_PLANE_TRUST
# - AGENT_INTEGRATION_SIGNATURE_KEYS
# - AGENT_MODEL_PROVIDER_SECRET_REFS

[env.staging]

[[env.staging.durable_objects.bindings]]
# named environment は top-level binding を継承しないため、staging の Agent aggregate を明示します。
name = "AI_AGENT"
class_name = "AIAgent"

[[env.staging.r2_buckets]]
# staging payload は production blob bucket と混在させず、Agent-owned storage だけを binding します。
binding = "AGENT_BLOBS"
bucket_name = "cf-tamac-agent-staging-blobs"

[env.staging.ai]
# staging でも Agent model execution capability を同じ Worker binding 名で解決します。
binding = "AI"

[env.staging.vars]
# Client Service JWT audience は staging Worker 固有値へ固定し、production token の流用を拒否します。
AGENT_RPC_AUDIENCE = "cf-tamac-agent-staging"

[[env.staging.ratelimits]]
# staging は専用 namespace を使い、検証 traffic が production allowance を消費しないようにします。
name = "PROVIDER_INGRESS_RATE_LIMITER"
namespace_id = "1002"

[env.staging.ratelimits.simple]
limit = 100
period = 60
