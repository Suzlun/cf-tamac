version: v2
plugins:
  # Agent Worker descriptors for Connect unary binary Protobuf handlers/clients.
  - local: protoc-gen-es
    out: src/generated/rpc
    opt:
      - target=ts
      - import_extension=none
  # Management Client server-only generated Agent RPC descriptors.
  - local: protoc-gen-es
    out: ../client/src/generated/agent-rpc
    opt:
      - target=ts
      - import_extension=none
