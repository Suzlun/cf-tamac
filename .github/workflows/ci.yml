name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Agent and Client package checks
        run: pnpm check:agent && pnpm check:management-client

      - name: Unit tests
        run: pnpm test:run

      - name: Agent and Client package tests
        run: pnpm test:agent && pnpm test:management-client

      - name: Codegen drift check
        run: pnpm check:codegen

      - name: Agent codegen target smoke
        run: pnpm gen:agent:proto && pnpm gen:agent:rpc
