syntax = "proto3";

package fixture.unstable;

message ReusedFieldNumber {
  string first = 1;
  string second = 1;
}

message ReusedReservedField {
  reserved 2;
  reserved "old_name";
  string current = 2;
  string old_name = 3;
}

service DuplicateMethodService {
  rpc DoThing(ReusedFieldNumber) returns (ReusedFieldNumber);
  rpc DoThing(ReusedFieldNumber) returns (ReusedFieldNumber);
}

service DuplicateService {
  rpc First(ReusedFieldNumber) returns (ReusedFieldNumber);
}

service DuplicateService {
  rpc Second(ReusedFieldNumber) returns (ReusedFieldNumber);
}
